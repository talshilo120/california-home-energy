<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" fill="none" role="img" aria-label="Illustration of a paver driveway and patio leading to a California home">
  <circle cx="404" cy="70" r="70" fill="#e8b04a" opacity="0.13"/>
  <circle cx="404" cy="70" r="38" fill="#e8b04a"/>
  <path d="M0 240 Q150 210 300 236 T520 224 V360 H0 Z" fill="#2c6828" opacity="0.35"/>

  <rect x="176" y="196" width="170" height="70" rx="4" fill="#12314e"/>
  <path d="M164 200 L261 148 L358 200 Z" fill="#1c4a72"/>
  <rect x="236" y="238" width="24" height="28" rx="2" fill="#c8952a"/>
  <rect x="196" y="212" width="24" height="20" rx="2" fill="#f0c569"/>
  <rect x="300" y="212" width="24" height="20" rx="2" fill="#f0c569"/>

  <!-- green border -->
  <path d="M0 268 Q170 250 350 272 T520 262 V360 H0 Z" fill="#3d8b37" opacity="0.35"/>

  <!-- paver walkway in perspective -->
  <g fill="#dbe7f2" stroke="#a8bdd2" stroke-width="1.2">
    <path d="M210 280 L312 280 L328 310 L194 310 Z"/>
    <path d="M194 310 L328 310 L348 348 L174 348 Z"/>
  </g>
  <!-- paver joint lines (staggered brick pattern) -->
  <g stroke="#a8bdd2" stroke-width="1" opacity="0.8">
    <line x1="234" y1="280" x2="222" y2="310"/>
    <line x1="258" y1="280" x2="250" y2="310"/>
    <line x1="282" y1="280" x2="278" y2="310"/>
    <line x1="210" y1="295" x2="322" y2="295"/>
    <line x1="216" y1="323" x2="204" y2="348"/>
    <line x1="252" y1="323" x2="248" y2="348"/>
    <line x1="288" y1="323" x2="292" y2="348"/>
    <line x1="324" y1="323" x2="336" y2="348"/>
    <line x1="180" y1="329" x2="342" y2="329"/>
  </g>

  <!-- small potted plant accent -->
  <g transform="translate(340,296)">
    <path d="M0 20 L26 20 L22 40 L4 40 Z" fill="#c8952a"/>
    <path d="M13 20 C4 6 22 6 13 -8 M13 20 C22 6 4 6 13 -8" stroke="#3d8b37" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
