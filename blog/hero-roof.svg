<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" fill="none" role="img" aria-label="Illustration of a cool reflective roof on a California home under strong sun">
  <circle cx="400" cy="70" r="90" fill="#e8b04a" opacity="0.16"/>
  <circle cx="400" cy="70" r="48" fill="#e8b04a"/>
  <g stroke="#e8b04a" stroke-width="4.5" stroke-linecap="round" opacity="0.8">
    <line x1="400" y1="6" x2="400" y2="-8"/>
    <line x1="466" y1="20" x2="478" y2="8"/>
    <line x1="334" y1="20" x2="322" y2="8"/>
    <line x1="484" y1="70" x2="500" y2="70"/>
    <line x1="316" y1="70" x2="300" y2="70"/>
  </g>
  <path d="M0 260 Q150 224 300 256 T520 242 V360 H0 Z" fill="#2c6828" opacity="0.45"/>
  <path d="M0 292 Q160 260 340 288 T520 276 V360 H0 Z" fill="#3d8b37" opacity="0.6"/>

  <rect x="170" y="222" width="180" height="102" rx="4" fill="#12314e"/>
  <rect x="246" y="272" width="26" height="52" rx="2" fill="#c8952a"/>
  <rect x="196" y="246" width="26" height="26" rx="2" fill="#f0c569"/>
  <rect x="300" y="246" width="26" height="26" rx="2" fill="#f0c569"/>

  <!-- reflective cool roof, bright + shingle texture -->
  <path d="M156 226 L260 156 L364 226 Z" fill="#dbe7f2"/>
  <path d="M156 226 L260 156 L364 226 Z" fill="url(#roofShine)" opacity="0.5"/>
  <defs>
    <linearGradient id="roofShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a8bdd2"/>
    </linearGradient>
  </defs>
  <g stroke="#a8bdd2" stroke-width="1.5" opacity="0.6">
    <path d="M186 208 L344 208"/>
    <path d="M206 191 L322 191"/>
    <path d="M228 175 L300 175"/>
  </g>

  <!-- reflection rays bouncing off the roof -->
  <g stroke="#f0c569" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="260" y1="170" x2="260" y2="140"/>
    <line x1="300" y1="188" x2="322" y2="168"/>
    <line x1="220" y1="188" x2="198" y2="168"/>
  </g>
</svg>
