<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" fill="none" role="img" aria-label="Illustration of water-wise drought-friendly landscaping in front of a California home">
  <circle cx="404" cy="70" r="70" fill="#e8b04a" opacity="0.13"/>
  <circle cx="404" cy="70" r="38" fill="#e8b04a"/>
  <path d="M0 240 Q150 210 300 236 T520 224 V360 H0 Z" fill="#2c6828" opacity="0.4"/>

  <rect x="176" y="196" width="170" height="70" rx="4" fill="#12314e"/>
  <path d="M164 200 L261 148 L358 200 Z" fill="#1c4a72"/>
  <rect x="236" y="238" width="24" height="28" rx="2" fill="#c8952a"/>
  <rect x="196" y="212" width="24" height="20" rx="2" fill="#f0c569"/>
  <rect x="300" y="212" width="24" height="20" rx="2" fill="#f0c569"/>

  <!-- decomposed granite / mulch ground -->
  <path d="M0 268 Q160 250 340 272 T520 262 V360 H0 Z" fill="#c9a876" opacity="0.5"/>
  <path d="M0 300 Q170 286 360 304 T520 296 V360 H0 Z" fill="#a9885e" opacity="0.55"/>

