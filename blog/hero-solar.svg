<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" fill="none" role="img" aria-label="Illustration of solar panels on a California home roof under a bright sun">
  <circle cx="410" cy="76" r="90" fill="#e8b04a" opacity="0.16"/>
  <circle cx="410" cy="76" r="50" fill="#e8b04a"/>
  <g stroke="#e8b04a" stroke-width="4.5" stroke-linecap="round" opacity="0.8">
    <line x1="410" y1="10" x2="410" y2="-4"/>
    <line x1="476" y1="24" x2="488" y2="12"/>
    <line x1="342" y1="24" x2="330" y2="12"/>
    <line x1="494" y1="76" x2="510" y2="76"/>
    <line x1="326" y1="76" x2="310" y2="76"/>
    <line x1="476" y1="128" x2="488" y2="140"/>
  </g>
  <path d="M0 250 Q140 210 280 244 T520 226 V360 H0 Z" fill="#2c6828" opacity="0.45"/>
  <path d="M0 288 Q160 250 340 282 T520 268 V360 H0 Z" fill="#3d8b37" opacity="0.6"/>

  <!-- house -->
  <rect x="176" y="228" width="170" height="96" rx="4" fill="#12314e"/>
  <path d="M164 232 L261 168 L358 232 Z" fill="#1c4a72"/>
  <rect x="236" y="278" width="26" height="46" rx="2" fill="#c8952a"/>
  <rect x="196" y="252" width="26" height="26" rx="2" fill="#f0c569"/>
  <rect x="300" y="252" width="26" height="26" rx="2" fill="#f0c569"/>

  <!-- big solar array covering roof, glowing -->
  <g transform="rotate(-32.5 261 200)">
    <rect x="200" y="182" width="130" height="52" rx="3" fill="#0b2138" stroke="#2c6828" stroke-width="2"/>
    <g stroke="#5c8cc0" stroke-width="1.3" opacity="0.95">
      <line x1="200" y1="195" x2="330" y2="195"/>
      <line x1="200" y1="208" x2="330" y2="208"/>
      <line x1="200" y1="221" x2="330" y2="221"/>
      <line x1="222" y1="182" x2="222" y2="234"/>
      <line x1="243" y1="182" x2="243" y2="234"/>
      <line x1="265" y1="182" x2="265" y2="234"/>
      <line x1="287" y1="182" x2="287" y2="234"/>
      <line x1="308" y1="182" x2="308" y2="234"/>
    </g>
    <!-- glow highlight cells -->
    <rect x="222" y="195" width="21" height="13" fill="#f0c569" opacity="0.35"/>
    <rect x="265" y="208" width="21" height="13" fill="#f0c569" opacity="0.3"/>
  </g>

  <!-- energy spark from panel to house -->
  <path d="M290 210 L282 226 L292 226 L280 244" stroke="#f0c569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
