<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" fill="none" role="img" aria-label="Cutaway illustration of a California home foundation being inspected">
  <circle cx="404" cy="70" r="70" fill="#e8b04a" opacity="0.13"/>
  <circle cx="404" cy="70" r="38" fill="#e8b04a"/>
  <path d="M0 250 Q150 220 300 248 T520 236 V360 H0 Z" fill="#2c6828" opacity="0.4"/>

  <rect x="176" y="196" width="170" height="70" rx="4" fill="#12314e"/>
  <path d="M164 200 L261 148 L358 200 Z" fill="#1c4a72"/>
  <rect x="236" y="238" width="24" height="28" rx="2" fill="#c8952a"/>
  <rect x="196" y="212" width="24" height="20" rx="2" fill="#f0c569"/>
  <rect x="300" y="212" width="24" height="20" rx="2" fill="#f0c569"/>

  <!-- ground line -->
  <rect x="0" y="266" width="520" height="94" fill="#a9885e" opacity="0.35"/>
  <line x1="0" y1="266" x2="520" y2="266" stroke="#8a6d47" stroke-width="2" opacity="0.6"/>

  <!-- foundation slab, cutaway -->
  <rect x="176" y="266" width="170" height="34" fill="#dbe7f2" stroke="#a8bdd2" stroke-width="2"/>
  <!-- crack -->
  <path d="M230 266 l6 10 l-4 8 l8 16" stroke="#b03a2e" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- magnifying glass inspecting the crack -->
  <g transform="translate(196,272)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#12314e" stroke-width="4"/>
    <line x1="33" y1="33" x2="48" y2="48" stroke="#12314e" stroke-width="5" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="12" fill="#eef6ed" opacity="0.5"/>
  </g>

  <!-- measuring / level tool accent -->
  <g transform="translate(280,278)">
    <rect x="0" y="0" width="50" height="12" rx="2" fill="#c8952a"/>
    <circle cx="25" cy="6" r="4" fill="#eef6ed"/>
    <circle cx="25" cy="6" r="2" fill="#3d8b37"/>
  </g>
</svg>
